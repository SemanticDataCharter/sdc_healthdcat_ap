validator.bannerHtml=<div><div style="display:table"><div style="display:table-row"><div style="display:table-cell;cursor:pointer" class="validatorReload"><div><img src="https://cdnlogo.com/logos/e/63/en.svg" alt="European Commission" style=" float: left; height: 80px" /><h1 style="position: relative; line-height:80px; margin:0; top: 25px;left:30px">HealthData@EU Validator</h1></div></div></div><div style="display:table-row"><div style="display:table-cell;padding-top:20px"><p>The HealthData@EU Central Platform is a pivotal digital system being developed by the European Commission to meet the requirements of the upcoming European Health Data Space Regulation. This platform hosts the Dataset Catalogue, which compiles metadata from member states, European institutions, third countries, and research infrastructures.</p><p> The HealthData@EU Validator is a validation tool where you can upload your RDF/XML or Turtle data and validate them against valid Health DCAT-AP shapes.</p></div></div></div><hr></div>


